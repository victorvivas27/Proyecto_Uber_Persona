version: "3.8"

services:
  backend:
    container_name: uber-victor-api
    build:
      context: .
    image: uber-victor:v1
    ports:
      - "5050:5050"
    environment:
      # Variables para que la API se conecte al Postgres del contenedor
      DB_HOST: ${DB_DOCKER_HOST}
      DB_PORT: ${DB_DOCKER_PORT}
      DB_NAME: ${DB_DOCKER_NAME}
      DB_USER: ${DB_DOCKER_USER}
      DB_PASSWORD: ${DB_DOCKER_PASSWORD}


    depends_on:
      - db
    networks:
      - uber_net
    restart: always

  db:
    container_name: uber-victor-db
    image: postgres:16
    ports:
      - "${DB_DOCKER_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_CREATION_NAME}
      POSTGRES_USER: ${DB_CREATION_USER}
      POSTGRES_PASSWORD: ${DB_CREATION_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uber_net
    restart: always

volumes:
  postgres_data:

networks:
  uber_net:
    driver: bridge
